name: Approve a world record

# Comment "approve" on an issue opened by "World records" (wr-watch.yml) to make that run a record. Only the
# repository's owner (the leaderboard's) can: anyone else's comment is ignored.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: world-records

jobs:
  approve:
    if: >-
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == 'github-actions[bot]' &&
      contains(github.event.issue.labels.*.name, 'world-record') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: install
        run: node wr-watch.mjs approve
        env:
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: Save it
        if: steps.install.outputs.done == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wr
          git commit -m "World record: ${MESSAGE}"
          git push
        env:
          MESSAGE: ${{ steps.install.outputs.message }}
      - name: Close the issue
        if: steps.install.outputs.done == 'yes'
        uses: actions/github-script@v7
        env:
          MESSAGE: ${{ steps.install.outputs.message }}
        with:
          script: |
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: process.env.MESSAGE + ". Every stats site shows it from its next build (daily at 05:23 UTC, or when its owner saves something)."});
            await github.rest.issues.update({...context.repo, issue_number: context.issue.number, state: "closed", state_reason: "completed"});
